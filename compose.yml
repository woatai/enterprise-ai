services:
  mysql:
    image: mysql:8.4
    container_name: enterprise-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./fastapi
    image: enterprise-fastapi:${APP_VERSION:-0.2.0}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # 容器之间通过 Compose 服务名通信，不能使用 API 容器自己的 127.0.0.1。
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    ports:
      # 只暴露给服务器本机；n8n 通过 enterprise_shared 访问容器端口。
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
      enterprise_shared:
        aliases:
          - enterprise-fastapi

networks:
  enterprise_shared:
    name: enterprise-shared
    external: true

volumes:
  mysql_data:
